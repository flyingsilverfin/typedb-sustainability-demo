<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" class="er" role="img" aria-label="ER diagram: containment relation; country contains province (parent, child) and province contains kabupaten (parent, child)">
  <g class="links" stroke="black" fill="none">
    <line x1="140" y1="83" x2="155" y2="83"/>
    <line x1="275" y1="83" x2="290" y2="83"/>
    <line x1="410" y1="83" x2="425" y2="83"/>
    <line x1="545" y1="83" x2="560" y2="83"/>
  </g>
  <g class="ent" fill="white" stroke="black">
    <rect x="20" y="60" width="120" height="46"/>
    <rect x="290" y="60" width="120" height="46"/>
    <rect x="560" y="60" width="120" height="46"/>
  </g>
  <g class="rel" fill="white" stroke="black">
    <polygon points="215,53 275,83 215,113 155,83"/>
    <polygon points="485,53 545,83 485,113 425,83"/>
  </g>
  <g text-anchor="middle" dominant-baseline="middle">
    <text x="80" y="83" class="name">country</text>
    <text x="350" y="83" class="name">province</text>
    <text x="620" y="83" class="name">kabupaten</text>
    <text x="215" y="83" class="relname" font-size="12">containment</text>
    <text x="485" y="83" class="relname" font-size="12">containment</text>
    <text x="150" y="132" class="role">parent</text>
    <text x="282" y="132" class="role">child</text>
    <text x="420" y="132" class="role">parent</text>
    <text x="552" y="132" class="role">child</text>
  </g>
</svg>

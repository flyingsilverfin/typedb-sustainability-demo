<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" class="er" role="img" aria-label="ER diagram: entities country, province and kabupaten, each with a key name attribute">
  <g class="links" stroke="black" fill="none">
    <line x1="110" y1="62" x2="110" y2="120"/>
    <line x1="320" y1="62" x2="320" y2="120"/>
    <line x1="530" y1="62" x2="530" y2="120"/>
  </g>
  <g class="attr" fill="white" stroke="gray">
    <ellipse cx="110" cy="42" rx="80" ry="20"/>
    <ellipse cx="320" cy="42" rx="84" ry="20"/>
    <ellipse cx="530" cy="42" rx="90" ry="20"/>
  </g>
  <g class="ent" fill="white" stroke="black">
    <rect x="40" y="120" width="140" height="48"/>
    <rect x="250" y="120" width="140" height="48"/>
    <rect x="460" y="120" width="140" height="48"/>
  </g>
  <g text-anchor="middle" dominant-baseline="middle">
    <text x="110" y="42" class="key" text-decoration="underline">country_name</text>
    <text x="320" y="42" class="key" text-decoration="underline">province_name</text>
    <text x="530" y="42" class="key" text-decoration="underline">kabupaten_name</text>
    <text x="110" y="144" class="name">country</text>
    <text x="320" y="144" class="name">province</text>
    <text x="530" y="144" class="name">kabupaten</text>
  </g>
</svg>

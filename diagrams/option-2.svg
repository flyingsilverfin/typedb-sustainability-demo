<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" class="er" role="img" aria-label="ER diagram, option 2: abstract facility with subtypes mill and refinery; company; ownership relation with roles owner and owned; companies can also be owned">
  <g class="links" stroke="black" fill="none">
    <line x1="380" y1="80" x2="380" y2="150"/>
    <line x1="300" y1="190" x2="230" y2="250"/>
    <line x1="460" y1="55" x2="558" y2="55"/>
    <line x1="175" y1="250" x2="130" y2="212"/>
    <line x1="230" y1="300" x2="230" y2="322"/>
    <line x1="214" y1="360" x2="140" y2="390"/>
    <line x1="246" y1="360" x2="320" y2="390"/>
  </g>
  <path class="new" d="M455,80 C540,110 540,175 460,190" stroke="black" fill="none" stroke-dasharray="6 4"/>
  <g class="attr" fill="white" stroke="gray">
    <ellipse cx="640" cy="55" rx="82" ry="20"/>
    <ellipse cx="110" cy="192" rx="80" ry="20"/>
